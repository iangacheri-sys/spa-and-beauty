kind = "slides"
previewPath = "/spa-deck/"
title = "Spa & Beauty Deck"
version = "1.0.0"
id = "artifacts/spa-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/spa-deck/" ]
localPort = 21753

[services.development]
run = "pnpm --filter @workspace/spa-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spa-deck", "run", "build" ]
publicDir = "artifacts/spa-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21753"
BASE_PATH = "/spa-deck/"
