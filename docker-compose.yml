version: "3.9"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: beautybooker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beautybooker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beautybooker_dev}
      POSTGRES_DB: ${POSTGRES_DB:-beautybooker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beautybooker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Server ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./artifacts/api-server
      dockerfile: Dockerfile
    container_name: beautybooker_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-beautybooker}:${POSTGRES_PASSWORD:-beautybooker_dev}@postgres:5432/${POSTGRES_DB:-beautybooker}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
